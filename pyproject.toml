[project]
name = "gliner-browser"
version = "0.1.0"
description = "A local browser CLI for AI agents, with persistent Playwright sessions and GLiNER2.5-powered element targeting."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai-agents", "browser-automation", "cli", "gliner", "playwright", "python"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "gliner2[local]==2.0.0",
  "playwright==1.58.0",
  "protobuf>=5,<7",
  "transformers>=4.38,<5",
]

[project.scripts]
gliner-browser = "gliner_browser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gliner_browser"]
